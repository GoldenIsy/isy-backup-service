schema: isy.backup.config/v1
deployment: development
environment: test
state_directory: /var/lib/isy-backup
staging_directory: /var/lib/isy-backup/staging
service:
  backup_interval_seconds: 86400
  heartbeat_interval_seconds: 30
  run_on_start: false
  listen_address: 0.0.0.0
  port: 8080
control:
  enabled: true
  socket: /run/isy-backup/backup.sock
  owner_uid: 1000
  group_gid: 1001
  mode: "0660"
  installation_id_file: /run/isy-backup/installation-id
  max_receipt_page_size: 100
  allowed_commands:
    - backup
    - repository-check
    - read-data-check
    - restore-test
    - cancel
sources:
  - id: application-files
    type: filesystem
    required: true
    root: /data/application
targets:
  - id: local
    type: filesystem
    required: true
    repository: /backup/restic
    password_file: /run/secrets/restic-password
    cache_directory: /var/cache/isy-backup/local
    retention:
      keep_daily: 7
      keep_weekly: 4
      keep_monthly: 12
      keep_yearly: 3
